[project]
name = "autofix-swe"
version = "2.0.0"
description = "Train and evaluate open-weight LLMs for automated GitHub issue resolution, with execution-verified rejection sampling."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "structlog>=24.1",
  "unidiff>=0.7.5",
  "docker>=7.1",
  "datasets>=3.0",
  "huggingface-hub>=0.25",
  "tqdm>=4.66",
]

[project.optional-dependencies]
# Training deps are heavy and CUDA-specific; keep them out of the base install
# so the data and evaluation pipelines run on a laptop with no GPU.
# Upper bounds are as load-bearing as the lower ones here. transformers 5.x
# removed classes that peft still imports (`BloomPreTrainedModel`), so an
# unpinned install resolves to transformers 5 and peft fails at import - which
# is exactly what happened on this cluster. The PEFT/TRL ecosystem tracks
# transformers 4.x; pin until they have all moved.
train = [
  "torch>=2.4",
  "numpy>=1.24,<3",
  "transformers>=4.45,<5",
  "peft>=0.13,<0.17",
  "trl>=0.11,<0.14",
  "bitsandbytes>=0.43,<0.46",
  "accelerate>=1.0,<2",
  "wandb>=0.18",
  "sentencepiece>=0.2",
]
# flash-attn is deliberately NOT listed above. It compiles from source, needs
# nvcc and a pre-installed torch at build time, and fails the whole `pip install`
# when either is missing - which is the common case on a cluster with no CUDA
# toolkit module. setup_env.sh attempts it separately and falls back to PyTorch's
# built-in `sdpa` attention, which is slower but numerically identical.
flash = ["flash-attn>=2.6"]
# vLLM is NOT installed alongside training. It pins an exact torch version
# (torch==2.13.0 at time of writing) and will drag the training environment
# onto a CUDA build the cluster driver cannot run. Inference happens in a
# separate conda env; see scripts/setup_serving_env.sh.
serve = ["openai>=1.50"]
dev = ["ruff>=0.6", "mypy>=1.11"]

[project.scripts]
autofix-data = "autofix.data.build:main"
autofix-train = "autofix.training.run:main"
autofix-sample = "autofix.rejection.run:main"
autofix-eval = "autofix.eval.run:main"
autofix-fix = "autofix.cli.main:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RET", "SIM"]
# ASYNC109: our `timeout` params are explicit wall-clock caps on subprocess and
#   container execution, which is exactly the intended use.
# S311: we seed `random.Random` deliberately for experiment reproducibility.
#   Nothing here is security-sensitive.
ignore = ["S101", "E501", "ASYNC109", "S311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
